name: Weekly NFL Predictions

on:
  schedule:
    - cron: '0 12 * * 4'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 

      - name: Install Dependencies
        run: pip install pandas scikit-learn nfl_data_py pyarrow

      - name: Run Predictive Engine
        run: python3 main.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add weekly_predictions.csv README.md
          git commit -m "Automated prediction and README update" || exit 0
          git push