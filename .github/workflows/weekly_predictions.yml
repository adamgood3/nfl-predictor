name: Weekly NFL Predictions

on:
  schedule:
    # Runs at 14:00 UTC (7:00 AM PDT) every Thursday morning
    - cron: '0 14 * * 4'
  workflow_dispatch: # Allows you to click a button on GitHub to run it manually anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run predictive engine
        run: |
          python main.py

      - name: Commit and push updated predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_predictions.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly predictions [skip ci]" && git push)
          