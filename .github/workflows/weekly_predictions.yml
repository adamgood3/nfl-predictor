name: Weekly NFL Predictions

on:
  schedule:
    # Runs at 12:00 UTC (5:00 AM Pacific Time for Walnut, CA) every Thursday
    - cron: '0 12 * * 4'
  workflow_dispatch: # Adds a manual "Run workflow" button to the Actions tab

permissions:
  contents: write # Grants the bot permission to save the CSV back to the repo

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Matching your local environment

      - name: Install Dependencies
        run: |
          pip install pandas scikit-learn nfl_data_py

      - name: Run Predictive Engine
        run: python3 main.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add weekly_predictions.csv
          # The '|| exit 0' prevents the workflow from failing if the data hasn't changed
          git commit -m "Automated prediction update" || exit 0
          git push